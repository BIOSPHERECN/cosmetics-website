backend:
  name: github
  repo: BIOSPHERECN/cosmetics-website
  branch: main
  auth_scope: repo

publish_mode: editorial_workflow
media_folder: public/images
public_folder: /images

i18n:
  structure: single_file
  locales: [en, id, zh]
  default_locale: en

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: content
    label: Website Content
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: All Content
        file: content/site.yaml
        i18n: true
        fields:
          - label: Navigation
            name: nav
            widget: object
            collapsed: true
            fields:
              - { label: Home, name: home, widget: string, i18n: true }
              - { label: About, name: about, widget: string, i18n: true }
              - { label: Products, name: products, widget: string, i18n: true }
              - { label: OEM/ODM, name: services, widget: string, i18n: true }
              - { label: Contact, name: contact, widget: string, i18n: true }
          - label: Hero Section
            name: hero
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Subtitle, name: subtitle, widget: text, i18n: true }
              - { label: CTA Button, name: cta, widget: string, i18n: true }
              - { label: Learn More, name: learnMore, widget: string, i18n: true }
          - label: About Section
            name: about
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Subtitle, name: subtitle, widget: text, i18n: true }
              - { label: Mission, name: mission, widget: text, i18n: true }
              - { label: Vision, name: vision, widget: text, i18n: true }
          - label: Why Choose Us
            name: whyUs
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Subtitle, name: subtitle, widget: text, i18n: true }
              - { label: Indonesia Expertise, name: indonesia, widget: string, i18n: true }
              - { label: Indonesia Description, name: indonesiaDesc, widget: text, i18n: true }
              - { label: Certified Quality, name: quality, widget: string, i18n: true }
              - { label: Quality Description, name: qualityDesc, widget: text, i18n: true }
              - { label: Flexible MOQ, name: flexible, widget: string, i18n: true }
              - { label: Flexible Description, name: flexibleDesc, widget: text, i18n: true }
              - { label: R&D Innovation, name: rnd, widget: string, i18n: true }
              - { label: R&D Description, name: rndDesc, widget: text, i18n: true }
          - label: Contact
            name: contact
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Subtitle, name: subtitle, widget: text, i18n: true }
              - { label: Address, name: addressValue, widget: string, i18n: true }
