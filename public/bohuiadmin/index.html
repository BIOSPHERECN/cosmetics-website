<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login - CosmoCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fdf2f4 0%, #fce7eb 50%, #f9d0d9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(206,45,88,0.12); }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #CE2D58, #ad1e47); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: white; font-family: serif; font-size: 24px; font-weight: bold; margin-bottom: 12px; }
    .logo h1 { font-family: serif; font-size: 22px; color: #1a1a2e; }
    .logo span { color: #CE2D58; }
    .logo p { color: #666; font-size: 13px; margin-top: 4px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #333; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; transition: all 0.2s; outline: none; }
    input:focus { border-color: #CE2D58; box-shadow: 0 0 0 3px rgba(206,45,88,0.1); }
    .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #CE2D58, #ad1e47); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(206,45,88,0.3); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">C</div>
      <h1>Cosmo<span>Care</span></h1>
      <p>Content Management</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" value="bohuiadmin" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="off" />
      </div>
      <div class="error" id="errorMsg">Invalid credentials</div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      btn.disabled = true; btn.textContent = 'Signing in...'; err.style.display = 'none';
      try {
        const res = await fetch('/api/bohuiadmin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
        });
        if (!res.ok) { err.style.display = 'block'; return; }
        window.location.href = '/bohuiadmin/dashboard';
      } catch { err.textContent = 'Network error'; err.style.display = 'block'; }
      finally { btn.disabled = false; btn.textContent = 'Sign In'; }
    });
  </script>
</body>
</html>
