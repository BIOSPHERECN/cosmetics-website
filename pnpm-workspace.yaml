# monorepo 三层分离(结构借鉴 Indivar/astro-fleet, MIT):
#   packages/* = 共享基座(组件/令牌/i18n)
#   sites/*    = 每站品牌皮肤 + 页面组装
#   content/   = 内容 JSON(不是包,由站点按品牌名读取)
packages:
  - packages/*
  - sites/*

# pnpm 11 用 allowBuilds(name: bool)放行依赖的 postinstall 构建脚本;
# 旧写法 onlyBuiltDependencies 在 pnpm 11 已不生效(实测:配了仍报 ERR_PNPM_IGNORED_BUILDS,
# 且 pnpm 会自己往本文件追加 allowBuilds 存根让人显式表态)。
# 只放行 Astro 工具链确实需要的两个,其余依赖的脚本一律仍拦。
allowBuilds:
  esbuild: true
  sharp: true
