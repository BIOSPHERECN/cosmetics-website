    vision: To be the leading cosmetic OEM/ODM manufacturer recognized globally for quality, innovation, and reliability.
    experience: 14+ Years
    experienceDesc: Deep industry expertise and proven track record
    quality: Quality First
    qualityDesc: Strict quality control at every production stage
    innovation: Innovation Driven
    innovationDesc: Continuous R&D to bring you market-leading products
    halalExpert: Halal Certification Expertise
    halalExpertDesc: Fully Halal-certified facility with strict adherence to Islamic guidelines, from raw materials to finished products
  id:
    title: Tentang Pabrik Kami
    subtitle: Dengan lebih dari 14 tahun spesialisasi di manufaktur OEM/ODM, kami adalah mitra tepercaya di belakang banyak merek kosmetik sukses di Indonesia dan sekitarnya.
    mission: Memberdayakan merek dengan solusi manufaktur kosmetik berkualitas tinggi dan inovatif yang mewujudkan visi mereka.
    vision: Menjadi produsen OEM/ODM kosmetik terkemuka yang diakui secara global untuk kualitas, inovasi, dan keandalan.
    experience: 14+ Tahun
    experienceDesc: Keahlian industri yang mendalam dan rekam jejak terbukti
