services:
  en:
    title: OEM / ODM Services
    subtitle: From concept to finished product — we handle every step of the manufacturing process
    capabilitiesTitle: Our Capabilities
    process:
      - title: Consultation & Briefing
        desc: We discuss your vision, requirements, budget, and timeline to develop a clear project roadmap.
      - title: Formula Development
        desc: Our R&D team creates custom formulations tailored to your specifications and market needs.
      - title: Sample Production
        desc: We produce samples for your approval, ensuring every detail meets your expectations.
      - title: Packaging Design
        desc: We help you design and source packaging that reflects your brand identity.
      - title: Mass Production
        desc: Large-scale manufacturing with rigorous quality control at every stage.
      - title: Logistics & Delivery
        desc: We handle packaging, labeling, and shipping to your destination.
    capabilities:
      - Halal-certified manufacturing (MUI/BPJPH)
      - Custom formulation development
      - GMP, ISO 22716 certified facilities
      - Flexible MOQ to suit startups and established brands
      - Private labeling and custom packaging
      - Regulatory compliance support (BPOM, etc.)
  id:
    title: Layanan OEM / ODM
    subtitle: Dari konsep hingga produk jadi — kami menangani setiap langkah proses manufaktur
    capabilitiesTitle: Kapabilitas Kami
    process:
      - title: Konsultasi & Briefing
        desc: Kami membahas visi, kebutuhan, anggaran, dan jadwal Anda untuk mengembangkan peta jalan proyek yang jelas.
      - title: Pengembangan Formula
        desc: Tim R&D kami menciptakan formulasi khusus yang disesuaikan dengan spesifikasi dan kebutuhan pasar Anda.
      - title: Produksi Sampel
        desc: Kami memproduksi sampel untuk persetujuan Anda, memastikan setiap detail memenuhi harapan Anda.
      - title: Desain Kemasan
        desc: Kami membantu Anda mendesain dan mencari kemasan yang mencerminkan identitas merek Anda.
      - title: Produksi Massal
        desc: Manufaktur skala besar dengan kontrol kualitas ketat di setiap tahap.
      - title: Logistik & Pengiriman
        desc: Kami menangani pengemasan, pelabelan, dan pengiriman ke tujuan Anda.
    capabilities:
      - Manufaktur bersertifikat Halal (MUI/BPJPH)
      - Pengembangan formulasi khusus
      - Fasilitas bersertifikat GMP, ISO 22716
      - MOQ fleksibel untuk startup dan merek mapan
      - Pelabelan pribadi dan kemasan khusus
      - Dukungan kepatuhan regulasi (BPOM, dll.)
  zh:
    title: OEM / ODM 服务
    subtitle: 从概念到成品 — 我们处理制造过程的每一个环节
    capabilitiesTitle: 我们的能力
    process:
      - title: 咨询与简报
        desc: 我们与您讨论愿景、需求、预算和时间表，制定清晰的项目路线图。
      - title: 配方开发
        desc: 我们的研发团队根据您的规格和市场需求定制配方。
      - title: 样品生产
        desc: 我们生产样品供您确认，确保每个细节符合您的期望。
      - title: 包装设计
        desc: 我们帮助您设计和采购反映品牌形象的包装。
      - title: 批量生产
        desc: 大规模生产，每个环节都有严格的质量控制。
      - title: 物流与交付
        desc: 我们处理包装、贴标和运输到目的地的所有环节。
    capabilities:
      - 清真认证生产（MUI/BPJPH认证）
      - 定制配方开发
      - GMP、ISO 22716认证工厂
      - 灵活起订量，适合初创和成熟品牌
      - 私标定制与定制包装
      - 法规合规支持（BPOM等）

